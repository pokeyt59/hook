# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

# needed to publish the alpha pre-release and tagged releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pbuild_commit=${{ github.sha }}
      - name: upload mod jar
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: upload sources jar
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/libs/*-sources.jar
      # every pushed build becomes the rolling "alpha" pre-release, which the in-game updater can download without a token
      - name: publish alpha
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          gh release delete alpha --yes --cleanup-tag || true
          gh release create alpha "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "alpha (${GITHUB_REF_NAME}@${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_REF_NAME}@${GITHUB_SHA}. Unstable, use at your own risk."
      # pushing a tag like v1.3.0 publishes a normal release, used by the "release" update channel
      - name: publish release
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --generate-notes
