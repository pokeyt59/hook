# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  # "Run workflow" in the Actions tab: builds the chosen branch and, with a version filled in, publishes it as a release
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release, e.g. 1.3.8 (creates tag v1.3.8). Leave empty for a plain build.'
        required: false
        default: ''

# needed to publish the alpha pre-release and tagged releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, the build number counts commits
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # tags build as their own version (v1.3.0 -> 1.3.0), everything else gets the patch number set to the
      # count of commits since mod_version last changed in gradle.properties (1.3.0 -> 1.3.1 -> 1.3.2 ...)
      - name: compute version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          base=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          core=${base%%+*}; meta=${base#*+}
          if [ -n "$RELEASE" ]; then
            version="${RELEASE#v}+$meta"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}+$meta"
          else
            since=$(git log -G '^mod_version=' --format=%H -1 -- gradle.properties)
            patch=$(git rev-list --count "$since"..HEAD)
            version="${core%.*}.$patch+$meta"
          fi
          echo "building version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build
        run: ./gradlew build -Pbuild_commit=${{ github.sha }} -Pmod_version=${{ steps.version.outputs.version }}
      - name: upload mod jar
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: upload sources jar
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/libs/*-sources.jar
      # every pushed build becomes the rolling "alpha" pre-release, which the in-game updater can download without a token
      - name: publish alpha
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          gh release delete alpha --yes --cleanup-tag || true
          gh release create alpha "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "alpha ${{ steps.version.outputs.version }} (${GITHUB_REF_NAME}@${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_REF_NAME}@${GITHUB_SHA}. Unstable, use at your own risk."
      # pushing a tag like v1.3.0 publishes a normal release, used by the "release" update channel
      - name: publish release
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          VERSION="${GITHUB_REF_NAME#v}"
          # the matching CHANGELOG.md section is the release text, github's generated notes if there is none
          awk -v v="## ${VERSION}" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag "${notes[@]}"
      # the Actions tab release button: tags the built commit and publishes the release in one go
      - name: publish release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          VERSION="${RELEASE#v}"
          # the matching CHANGELOG.md section is the release text, github's generated notes if there is none
          awk -v v="## ${VERSION}" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v${RELEASE#v}" "$jar" --target "$GITHUB_SHA" \
            --title "dchook ${{ steps.version.outputs.version }}" "${notes[@]}"
